# Cloudflare Worker for Mac Mouse Fix NG community setups. See README.md for the owner steps.
# database_id is the ID that `npx wrangler d1 create mmf-community` printed. A new database needs a new ID here.
# This file holds no account ID and no token: wrangler takes them from `npx wrangler login`.

name = "mmf-community"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "mmf-community"
database_id = "f4f6c269-677c-43c0-b78b-39c37e0d0417"

# Workers Logs stay off: the Worker keeps no request logs of its own.
[observability]
enabled = false
